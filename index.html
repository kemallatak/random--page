
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { font-size: 3rem; }
    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Selam Dünya 🚀</h1>
    <p>İlk GitHub Pages sitem yayında!</p>
    <button onclick="document.getElementById('title').textContent =
      ['Merhaba 👋','Naber kanka 😎','Hello World 🚀','GG WP 🎮'][Math.floor(Math.random()*4)]">
      Değiştir
    </button>
  </main>
</body>
</html>
